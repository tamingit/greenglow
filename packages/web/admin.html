<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <!-- Installable as an app (no service worker: nothing works offline). -->
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta name="theme-color" content="#1d4d2c" />
    <link rel="icon" href="/icons/favicon-32.png" type="image/png" sizes="32x32" />
    <link rel="icon" href="/icons/icon-192.png" type="image/png" sizes="192x192" />
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
    <meta name="apple-mobile-web-app-title" content="GreenGlow" />
    <title>GreenGlow Connect administration</title>
  </head>
  <body class="admin">
    <header class="app-bar">
      <div class="bar-inner">
        <a class="bar-brand" href="/" title="Back to the terminal">
          <img class="bar-brand-mark" src="/icons/icon-192.png" alt="" width="32" height="32" />
          <h1 class="bar-brand-name">GreenGlow Connect</h1>
        </a>
        <span class="admin-bar-title">Administration</span>
        <span id="admin-user" class="admin-bar-user"></span>
        <a class="bar-btn" href="/help.html#admin" target="_blank" rel="noopener">Help</a>
        <a class="bar-btn" href="/">Back to the terminal</a>
      </div>
    </header>
    <main class="admin-main">
      <nav class="admin-tabs" role="tablist" aria-label="Administration"></nav>
      <p id="admin-message" class="admin-message" role="status" hidden></p>
      <div id="admin-panels"></div>
    </main>
    <script type="module" src="/src/admin/main.ts"></script>
  </body>
</html>
