
name: Release

# Published releases:
#   vX.Y.Z-beta[.N] -> X.Y.Z-beta[.N], beta
#   vX.Y.Z          -> X.Y.Z, prod
#
# Non-main branch pushes:
#   feature/login   -> feature-login, preview-sha-<commit>
#
# Preview images inactive for 30 days are deleted nightly.
# Manual workflow runs can preview cleanup without deleting.

on:
  push:
    branches-ignore:
      - main

  release:
    types: [published]

  schedule:
    - cron: "17 4 * * *"

  workflow_dispatch:
    inputs:
      dry_run:
        description: "Preview cleanup without deleting images"
        type: boolean
        default: true

permissions:
  contents: read

# Release builds always finish. A newer push cancels
# an older run for the same branch.
concurrency:
  group: greenglow-${{ github.event_name == 'release' && github.event.release.tag_name || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'push' }}

env:
  IMAGE: ghcr.io/tamingit/greenglow

jobs:
  prepare:
    name: Validate build
    if: >-
      github.event_name == 'release' ||
      (github.event_name == 'push' && !github.event.deleted)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      version: ${{ steps.tag.outputs.version }}
      channel: ${{ steps.tag.outputs.channel }}
    steps:
      - name: Check out repository for release validation
        if: github.event_name == 'release'
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Validate release tag and main ancestry
        if: github.event_name == 'release'
        id: tag
        shell: bash
        env:
          TAG: ${{ github.event.release.tag_name }}
        run: |
          set -euo pipefail

          if [[ ! "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-beta(\.[0-9]+)?)?$ ]]; then
            echo "Invalid release tag: $TAG" >&2
            exit 1
          fi

          channel=prod
          [[ "$TAG" == *-beta* ]] && channel=beta

          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "Release commit is not on main." >&2
            exit 1
          fi

          echo "version=${TAG#v}" >> "$GITHUB_OUTPUT"
          echo "channel=$channel" >> "$GITHUB_OUTPUT"

  check:
    name: Run every check
    needs: prepare
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      # Type checks, lint, format, Vitest, dotnet,
      # and Playwright tests against the fake IBM i.
      - name: Build the CI image
        run: docker build -f ci/Dockerfile -t greenglow-ci .

      - name: Run the checks
        run: docker run --rm greenglow-ci

  publish:
    name: Build and push the image
    needs: [prepare, check]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Generate image tags
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE }}
          flavor: |
            latest=false
          tags: |
            type=ref,event=branch,enable=${{ github.event_name == 'push' }}
            type=sha,format=long,prefix=preview-sha-,enable=${{ github.event_name == 'push' }}
            type=raw,value=${{ needs.prepare.outputs.version }},enable=${{ github.event_name == 'release' }}
            type=raw,value=${{ needs.prepare.outputs.channel }},enable=${{ github.event_name == 'release' }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.version=${{ github.event_name == 'release' && needs.prepare.outputs.version || github.ref_name }}

      # Branch names must not overwrite production tags.
      - name: Protect release tag names
        if: github.event_name == 'push'
        shell: bash
        env:
          IMAGE_TAGS: ${{ steps.meta.outputs.tags }}
        run: |
          set -euo pipefail

          # The branch ref tag has higher priority than
          # the preview SHA tag, so it appears first.
          first_image="${IMAGE_TAGS%%$'\n'*}"
          tag="${first_image##*:}"

          if [[ "$tag" == "prod" ||
                "$tag" == "beta" ||
                "$tag" == preview-sha-* ||
                "$tag" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-beta(\.[0-9]+)?)?$ ]]; then
            echo "Branch tag '$tag' uses a reserved tag name." >&2
            exit 1
          fi

      - name: Sign in to GitHub's registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          pull: true
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Summary
        shell: bash
        env:
          IMAGE_TAGS: ${{ steps.meta.outputs.tags }}
        run: |
          {
            echo "### Published images"
            while IFS= read -r tag; do
              [[ -n "$tag" ]] && echo "- \`$tag\`"
            done <<< "$IMAGE_TAGS"
          } >> "$GITHUB_STEP_SUMMARY"

  cleanup:
    name: Remove expired preview images
    if: >-
      github.event_name == 'schedule' ||
      github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      packages: write
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      ENDPOINT: orgs/tamingit/packages/container/greenglow/versions
      DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run || false }}

    steps:
      - name: Find and delete expired previews
        shell: bash
        run: |
          set -euo pipefail

          cutoff="$(date -u -d '30 days ago' +'%Y-%m-%dT%H:%M:%SZ')"
          echo "Looking for preview versions older than $cutoff"

          # Retrieve every page of package versions.
          gh api --paginate --slurp \
            "${ENDPOINT}?per_page=100" > versions.json

          # Delete only versions that:
          # 1. Haven't been updated in 30 days.
          # 2. Have our preview-sha- marker.
          # 3. Do not carry any protected release tag.
          jq -r --arg cutoff "$cutoff" '
            .[][] |
            select((.updated_at // .created_at) < $cutoff) |
            select(
              (.metadata.container.tags // []) |
              any(.[]; startswith("preview-sha-"))
            ) |
            select(
              (.metadata.container.tags // []) |
              all(.[];
                . != "prod" and
                . != "beta" and
                (test("^[0-9]+\\.[0-9]+\\.[0-9]+(-beta(\\.[0-9]+)?)?$") | not)
              )
            ) |
            .id
          ' versions.json > expired-ids.txt

          count=0

          while IFS= read -r id; do
            [[ -n "$id" ]] || continue

            if [[ "$DRY_RUN" == "true" ]]; then
              echo "[DRY RUN] Would delete version $id"
            else
              echo "Deleting preview version $id"
              gh api -X DELETE "$ENDPOINT/$id"
            fi

            count=$((count + 1))
          done < expired-ids.txt

          echo "Preview versions matched: $count"

          if [[ "$DRY_RUN" == "true" ]]; then
            echo "Dry run only; nothing was deleted."
          fi

          {
            echo "### GHCR preview cleanup"
            echo "Cutoff: $cutoff"
            echo "Matched versions: $count"
            echo "Dry run: $DRY_RUN"
          } >> "$GITHUB_STEP_SUMMARY"

