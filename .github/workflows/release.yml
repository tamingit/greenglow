name: Release

# A published GitHub release runs every check, then builds the server image and pushes it to
# GitHub's container registry. Nothing is deployed: that is done by hand on the server (see
# "Releases" in the README).
#
#   vX.Y.Z-beta or vX.Y.Z-beta.N  →  ghcr.io/tamingit/greenglow:X.Y.Z-beta.N  and  :beta
#   vX.Y.Z                        →  ghcr.io/tamingit/greenglow:X.Y.Z         and  :prod
#
# Any other tag is refused, and so is a release whose commit isn't on main.
#
#   gh release create v1.0.0-beta.1 --target main --prerelease --generate-notes
#   gh release create v1.0.0 --target main --generate-notes
#
on:
  release:
    types: [published]

# Least-privilege default; only the publish job may write packages.
permissions:
  contents: read

# One build per release; let it finish rather than cancelling it.
concurrency:
  group: greenglow-release-${{ github.event.release.tag_name }}
  cancel-in-progress: false

env:
  IMAGE: ghcr.io/tamingit/greenglow

jobs:
  release:
    name: Check the release
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      version: ${{ steps.tag.outputs.version }}
      channel: ${{ steps.tag.outputs.channel }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Read the tag, and check it is on main
        id: tag
        shell: bash
        env:
          TAG: ${{ github.event.release.tag_name }}
        run: |
          set -euo pipefail
          if [[ ! "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-beta(\.[0-9]+)?)?$ ]]; then
            echo "Tag '$TAG' is neither vX.Y.Z (prod) nor vX.Y.Z-beta[.N] (beta); refusing to build." >&2
            exit 1
          fi
          channel=prod
          [[ "$TAG" == *-beta* ]] && channel=beta
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "Tag '$TAG' is on a commit that isn't on main; refusing to build." >&2
            exit 1
          fi
          echo "version=${TAG#v}" >> "$GITHUB_OUTPUT"
          echo "channel=$channel" >> "$GITHUB_OUTPUT"
          echo "Building ${IMAGE}:${TAG#v} for $channel"

  check:
    name: Run every check
    needs: release
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      # Type checks, lint, format check, Vitest, dotnet test and the Playwright browser tests
      # against the fake IBM i (npm run ci). The live IBM i tests are skipped: no E2E_IBMI_*.
      - name: Build the CI image
        run: docker build -f ci/Dockerfile -t greenglow-ci .

      - name: Run the checks
        run: docker run --rm greenglow-ci

  publish:
    name: Build and push the image
    needs: [release, check]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Sign in to GitHub's registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          pull: true
          push: true
          tags: |
            ${{ env.IMAGE }}:${{ needs.release.outputs.version }}
            ${{ env.IMAGE }}:${{ needs.release.outputs.channel }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.version=${{ needs.release.outputs.version }}
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Summary
        shell: bash
        run: |
          {
            echo "Pushed \`${IMAGE}:${{ needs.release.outputs.version }}\` and \`${IMAGE}:${{ needs.release.outputs.channel }}\`."
            echo
            echo "Deploy on the server: \`docker compose pull && docker compose up -d\`"
          } >> "$GITHUB_STEP_SUMMARY"
